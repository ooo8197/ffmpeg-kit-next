name: Build Android FFmpeg Kit AAR

on:
  workflow_dispatch:
    inputs:
      target_arch:
        description: '編譯架構 (預設 arm64-v8a)'
        required: true
        default: 'arm64-v8a'
        type: choice
        options:
          - arm64-v8a
          - armeabi-v7a
          - x86_64
          - all

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 檢出專案原始碼 (包含 Submodules)
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # 2. 設定 Java 17 (Gradle 8+ 需要)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. 設定 Android SDK & NDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 4. 安裝指定版本的 NDK (r27b 支援 16KB Page Size)
      - name: Install NDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "ndk;27.1.12297006" "cmake;3.22.1"

      # 5. 執行 Gradle 構建 .aar
      - name: Build AAR with Gradle
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          export ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.1.12297006
          
          # 進到 android 資料夾
          cd android
          
          # 給予 gradlew 執行權限
          chmod +x gradlew
          
          # 指定架構並編譯 Release 版 AAR
          if [ "${{ inputs.target_arch }}" != "all" ]; then
            ./gradlew assembleRelease -Pandroid.injected.build.abi=${{ inputs.target_arch }}
          else
            ./gradlew assembleRelease
          fi

      # 6. 打包並上傳產出的 .aar 檔案
      - name: Upload Built AAR
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ffmpeg-kit-android-${{ inputs.target_arch }}
          path: |
            android/ffmpeg-kit-next-android-lib/build/outputs/aar/*.aar
            **/*.aar
