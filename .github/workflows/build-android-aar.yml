name: Build Android FFmpeg Kit AAR

on:
  workflow_dispatch:
    inputs:
      target_arch:
        description: '編譯架構 (預設僅編譯 arm64-v8a 速度最快、體積最小)'
        required: true
        default: 'arm64-v8a'
        type: choice
        options:
          - arm64-v8a
          - arm-v7a
          - x86_64
          - all

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 檢出專案原始碼
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 2. 設定 Java 環境 (編譯 AAR 需要)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. 設定 Android SDK 與 NDK (修正為穩定版 setup-android)
      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v3

      # 4. 安裝指定版本的 NDK (r27b)
      - name: Install NDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "ndk;27.1.12297006"

      # 5. 安裝 Linux 必要編譯工具
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config curl mercurial cmake ninja-build gettext tar

      # 6. 執行 FFmpeg-Kit 編譯腳本
      - name: Run Build Script
        run: |
          export ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.1.12297006
          chmod +x android.sh
          
          if [ "${{ inputs.target_arch }}" = "all" ]; then
            ./android.sh
          else
            ./android.sh --target=${{ inputs.target_arch }}
          fi

      # 7. 打包並上傳編譯好的 .aar 檔案
      - name: Upload Built AAR
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-kit-android-${{ inputs.target_arch }}
          path: |
            build/output/*.aar
            **/build/outputs/aar/*.aar
