name: Build Android FFmpeg Kit AAR

on:
  workflow_dispatch:
    inputs:
      target_arch:
        description: '編譯架構 (預設僅編譯 arm64-v8a 速度最快、體積最小)'
        required: true
        default: 'arm64-v8a'
        type: choice
        options:
          - arm64-v8a
          - arm-v7a
          - x86_64
          - all

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 檢出專案原始碼 (包含 Git Submodules)
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # 2. 設定 Java 環境
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. 設定 Android SDK & NDK
      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v3

      # 4. 安裝指定版本的 NDK
      - name: Install NDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "ndk;27.1.12297006"

      # 5. 安裝 Linux 必要編譯工具與依賴
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config curl mercurial cmake ninja-build gettext tar groff texinfo yasm nasm

      # 6. 切換至 android 資料夾並執行編譯腳本
      - name: Run Build Script
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          export ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.1.12297006
          
          # 檢查 android.sh 檔案位置並切換目錄
          if [ -d "android" ]; then
            cd android
          fi
          
          # 確保所有 .sh 腳本有執行權限
          chmod +x *.sh
          chmod +x ../scripts/*.sh 2>/dev/null || true
          
          # 執行編譯
          if [ "${{ inputs.target_arch }}" = "all" ]; then
            ./android.sh
          else
            ./android.sh --target=${{ inputs.target_arch }}
          fi

      # 7. 打包並上傳編譯好的 .aar 檔案
      - name: Upload Built AAR
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ffmpeg-kit-android-${{ inputs.target_arch }}
          path: |
            android/app/build/outputs/aar/*.aar
            android/build/output/*.aar
            build/output/*.aar
            **/*.aar
