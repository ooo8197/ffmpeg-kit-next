name: Build Android FFmpeg Kit AAR

on:
  workflow_dispatch:
    inputs:
      target_arch:
        description: '編譯架構 (預設僅編譯 arm64-v8a 速度最快、體積最小)'
        required: true
        default: 'arm64-v8a'
        type: choice
        options:
          - arm64-v8a
          - arm-v7a
          - x86_64
          - all

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android NDK
        uses: nsetup/setup-ndk@v1
        with:
          ndk-version: r27b

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config curl mercurial cmake ninja-build gettext tar

      - name: Run Build Script
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          chmod +x android.sh
          if [ "${{ inputs.target_arch }}" = "all" ]; then
            ./android.sh
          else
            ./android.sh --target=${{ inputs.target_arch }}
          fi

      - name: Upload Built AAR
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-kit-android-${{ inputs.target_arch }}
          path: |
            build/output/*.aar
            **/build/outputs/aar/*.aar
